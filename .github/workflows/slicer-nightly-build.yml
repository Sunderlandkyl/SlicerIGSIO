# Builds this extension against the Slicer build published by the Slicer
# repository's "Build" workflow.
#
# Everything the build needs is in the workflow Slicer provides: restoring the
# published build tree, configuring, building, testing, packaging, loading the
# result into Slicer and uploading the package.
name: Build against the Slicer nightly

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # After the Slicer nightly.
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    # On Slicer/Slicer this is Slicer/Slicer/.github/workflows/extension-build.yml@main
    uses: Sunderlandkyl/Slicer/.github/workflows/extension-build.yml@exp/extension-workflow
    with:
      platforms: linux,macos,windows
      slicer-repository: Sunderlandkyl/Slicer
      slicer-ref: exp/extension-workflow
      publish: true
