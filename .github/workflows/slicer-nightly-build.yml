# Builds this extension against the Slicer build published by the Slicer
# repository's "Build" workflow.
#
# Everything the build needs is in the workflow Slicer provides: restoring the
# published build tree, configuring, building, testing, packaging, loading the
# result into Slicer and uploading the package.
name: Build against the Slicer nightly
# The platform in the name of the run: Slicer starts one run per platform.
run-name: ${{ inputs.platforms && format('{0} - build against the Slicer nightly', inputs.platforms) || format('all platforms - {0}', github.event_name) }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      # Slicer's Reconcile extensions workflow starts one run per platform, so
      # that no platform waits for another.
      platforms:
        description: "Platforms to build (comma separated; default: all)"
        default: ""
  schedule:
    # After the Slicer nightly.
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    # On Slicer/Slicer this is Slicer/Slicer/.github/workflows/extension-build.yml@main
    uses: Sunderlandkyl/Slicer/.github/workflows/extension-build.yml@ci/github-actions-build
    with:
      # web: for SlicerWeb, against the web build tree of the nightly.
      platforms: ${{ inputs.platforms || 'linux,macos,windows,web' }}
      slicer-repository: Sunderlandkyl/Slicer
      slicer-ref: ci/github-actions-build
      # To the nightly release, which says what each package was built
      # against, each platform as soon as it is built. A commit to this branch
      # publishes, and so do the builds Slicer's Reconcile extensions workflow
      # starts, for a new Slicer or a new package of an extension this one
      # depends on; a pull request or another branch builds and tests.
      publish: >-
        ${{ github.event_name == 'workflow_dispatch'
            || (github.event_name == 'push' && github.ref_name == 'ci/slicer-actions-test') }}
      # For the extensions that depend on this one, which build against it.
      publish-build-tree: true
